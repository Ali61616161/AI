# Canlı servis kontrolü: geçici bir test hesabıyla gerçek Supabase fonksiyonlarını çağırır
# (Gemini, Google Places/Weather/Translation) ve sonucu özetler; sonunda hesabı siler.
# Anahtar veya kişisel veri yazdırmaz. Elle çalışır (Actions → Canlı kontrol → Run).
# Gerekli sırlar: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
name: Canlı kontrol

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Kontrol
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -u
          ref=$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')
          token=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$token"
          keys=$(curl -sSf -H "Authorization: Bearer $token" "https://api.supabase.com/v1/projects/$ref/api-keys?reveal=true")
          service=$(echo "$keys" | jq -r '(map(select(.name == "service_role")) + map(select(.type == "secret")))[0].api_key')
          anon=$(echo "$keys" | jq -r '(map(select(.name == "anon")) + map(select(.type == "publishable")))[0].api_key')
          echo "::add-mask::$service"
          base="https://$ref.supabase.co"
          sum() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          sum "### Sunucu sırları"
          names=$(curl -sSf -H "Authorization: Bearer $token" "https://api.supabase.com/v1/projects/$ref/secrets" | jq -r '.[].name')
          for n in GEMINI_API_KEY GOOGLE_MAPS_API_KEY GOOGLE_TRANSLATE_API_KEY REVENUECAT_SECRET_KEY REVENUECAT_WEBHOOK_AUTH AERODATABOX_KEY TRAVELPAYOUTS_TOKEN; do
            if echo "$names" | grep -qx "$n"; then sum "- ✅ $n"; else sum "- ❌ $n eksik"; fi
          done

          # Geçici test hesabı (rastgele şifre, sonunda silinir).
          email="smoke-$(date +%s)-$RANDOM@yola-test.invalid"
          pass=$(openssl rand -base64 24)
          echo "::add-mask::$pass"
          uid=$(curl -sSf -X POST "$base/auth/v1/admin/users" -H "apikey: $service" -H "Authorization: Bearer $service" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$email" --arg p "$pass" '{email: $e, password: $p, email_confirm: true, user_metadata: {language: "tr"}}')" | jq -r '.id')
          trap 'curl -s -X DELETE "$base/auth/v1/admin/users/$uid" -H "apikey: $service" -H "Authorization: Bearer $service" >/dev/null' EXIT
          jwt=$(curl -sSf -X POST "$base/auth/v1/token?grant_type=password" -H "apikey: $anon" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$email" --arg p "$pass" '{email: $e, password: $p}')" | jq -r '.access_token')
          echo "::add-mask::$jwt"
          curl -sS -X PATCH "$base/rest/v1/profiles?id=eq.$uid" -H "apikey: $anon" -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' \
            -d '{"home_city":"İstanbul","home_country":"TR","passport_country":"TR"}' >/dev/null

          call() { curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$base/functions/v1/$1" -H "apikey: $anon" -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -d "$2"; }
          check() {
            code=$(call "$2" "$3")
            if [ "$code" = 200 ]; then sum "- ✅ $1 — $(jq -r "$4" /tmp/out.json 2>/dev/null | head -c 160)"
            else sum "- ❌ $1 — HTTP $code $(jq -r '"\(.error.code // "") \(.error.message // "")"' /tmp/out.json 2>/dev/null | head -c 300)"; fi
          }
          sum "### Servisler"
          check "Google Places (açık yerler)" places '{"action":"open_now","lat":41.0369,"lng":28.985,"category":"cafe"}' '"\(.places | length) yer, ör. \(.places[0].name // "-")"'
          pid=$(jq -r '.places[0].id // empty' /tmp/out.json 2>/dev/null)
          if [ -n "$pid" ]; then
            check "Google mekân kartı (ayrıntı + fotoğraf)" places "$(jq -n --arg p "$pid" '{action:"place",place_id:$p}')" '"\(.place.name) · \(.place.photos | length) fotoğraf · \(.place.hours | length) gün saat · puan \(.place.rating)"'
          fi
          check "Şehir arama (Google Autocomplete: Roma → ülke)" places '{"action":"city_suggest","input":"Roma","session_token":"smokeSession12345"}' '"\(.cities | length) öneri, ilki: \(.cities[0].name) (\(.cities[0].detail))"'
          cid=$(jq -r '.cities[0].place_id // empty' /tmp/out.json 2>/dev/null)
          if [ -n "$cid" ]; then
            check "Şehir seçimi (ülke kodu)" places "$(jq -n --arg p "$cid" '{action:"city_pick",place_id:$p,session_token:"smokeSession12345"}')" '"\(.city.name) · \(.city.country_code)"'
          fi
          check "Google Weather" places '{"action":"weather","lat":41.0369,"lng":28.985}' '"\(.days | length) gün tahmin"'
          check "Google Routes (Nasıl giderim: Interlaken → Grindelwald)" places '{"action":"route","origin":{"address":"Interlaken Ost, Switzerland"},"destination":{"address":"Grindelwald, Switzerland"},"origin_name":"Interlaken","destination_name":"Grindelwald","country_code":"CH"}' '"\(.routes | length) güzergah; ilk: \([.routes[0].steps[] | (.transit.lineShort // .transit.line // .mode)] | join(" → ")) (\(.routes[0].durationMin) dk)"'
          check "Rota çizgisi (uygulama içi harita)" places '{"action":"route","origin":{"address":"Interlaken Ost, Switzerland"},"destination":{"address":"Grindelwald, Switzerland"},"country_code":"CH"}' '"çizgi \(.routes[0].polyline | length) karakter"'
          # Sohbet: konumdan en fazla ~3 km uzakta GERÇEK yerler önermeli (Taksim).
          code=$(call replan '{"mode":"crisis","message":"Yağmur başladı, 1 km içinde kapalı bir yer bul","location":{"lat":41.0370,"lng":28.9850},"timezone":"Europe/Istanbul"}')
          if [ "$code" = 200 ]; then
            far=$(jq -r '[.suggestions[] | select(.lat != null) | (((.lat - 41.0370) * 111) as $a | ((.lng - 28.9850) * 83.9) as $b | (($a * $a + $b * $b) | sqrt))] | if length == 0 then "yok" else (max * 10 | round / 10 | tostring) end' /tmp/out.json)
            n=$(jq '.suggestions | length' /tmp/out.json)
            if [ "$far" = "yok" ]; then sum "- ⚠️ Sohbet: $n öneri ama konumlu yer yok"
            elif awk "BEGIN{exit !($far <= 3)}"; then sum "- ✅ Sohbet (yakın yer): $n öneri, en uzağı $far km"
            else sum "- ❌ Sohbet (yakın yer): en uzak öneri $far km (3 km'den fazla)"; fi
          else sum "- ❌ Sohbet (replan) — HTTP $code $(jq -r '"\(.error.code // "")"' /tmp/out.json | head -c 100)"; fi
          check "Google Translation" translate '{"mode":"text","text":"Good morning","target":"tr"}' '.translation // .text // "çeviri geldi"'
          check "Google doğal ses (Text-to-Speech)" translate '{"mode":"speak","text":"Hallo, wie geht es dir?","target":"de","voice_lang":"de-DE"}' '"ses: \(.voice), \(.audio | length) karakter"'
          check "Uçuş durumu (AeroDataBox anahtarı)" flight-status '{"check":true}' 'if .configured then "anahtar tanımlı, servis \(.provider_status) (\(if .provider_ok then "çalışıyor" else "reddetti: " + (.provider_message // "") end))" else "anahtar tanımlı değil" end'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/functions/v1/flight-watch" -H 'Content-Type: application/json' -d '{}')
          if [ "$code" = 401 ]; then sum "- ✅ Uçuş zamanlayıcı (flight-watch) yayında, sırsız çağrı reddedildi"; else sum "- ❌ Uçuş zamanlayıcı (flight-watch) — beklenen 401, gelen HTTP $code"; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$base/functions/v1/price-watch" -H 'Content-Type: application/json' -d '{}')
          if [ "$code" = 401 ]; then sum "- ✅ Fiyat zamanlayıcı (price-watch) yayında, sırsız çağrı reddedildi"; else sum "- ❌ Fiyat zamanlayıcı (price-watch) — beklenen 401, gelen HTTP $code"; fi
          # Canlı fiyat takibi: geçici hesaba İstanbul → Roma takibi ekler, zamanlayıcıyı çalıştırır, fiyatı okur.
          depart=$(date -u -d '+45 days' +%F)
          code=$(curl -sS -o /tmp/watch.json -w '%{http_code}' -X POST "$base/rest/v1/price_watches" -H "apikey: $anon" -H "Authorization: Bearer $jwt" -H 'Content-Type: application/json' -H 'Prefer: return=representation' \
            -d "$(jq -n --arg d "$depart" '{origin_code:"IST",origin_name:"Istanbul",destination_code:"ROM",destination_name:"Rome",depart_on:$d,currency:"EUR",target_price:5000}')")
          if [ "$code" = 201 ]; then
            cron=$(curl -sS "$base/rest/v1/internal_secrets?key=eq.cron&select=value" -H "apikey: $service" -H "Authorization: Bearer $service" | jq -r '.[0].value // empty')
            echo "::add-mask::$cron"
            run=$(curl -sS -X POST "$base/functions/v1/price-watch" -H 'Content-Type: application/json' -H "x-cron-secret: $cron" -d '{}')
            sum "- ℹ️ Fiyat takibi çalıştırma yanıtı: $(echo "$run" | head -c 200)"
            row=$(curl -sS "$base/rest/v1/price_watches?user_id=eq.$uid&select=last_price,last_airline,last_checked_at,currency" -H "apikey: $service" -H "Authorization: Bearer $service")
            price=$(echo "$row" | jq -r '.[0].last_price // empty')
            if [ -n "$price" ]; then sum "- ✅ Fiyat takibi canlı: İstanbul → Roma $depart en ucuz $price $(echo "$row" | jq -r '.[0].currency') ($(echo "$row" | jq -r '.[0].last_airline // "havayolu ?"'))"
            elif echo "$run" | jq -e '.configured == false' >/dev/null 2>&1; then sum "- ⚠️ Fiyat takibi: TRAVELPAYOUTS_TOKEN tanımlı değil, kontrol atlandı"
            else sum "- ❌ Fiyat takibi: fiyat okunamadı (sağlayıcı yanıtı boş ya da reddetti; yukarıdaki yanıta bak)"; fi
          else sum "- ❌ Fiyat takibi kaydı eklenemedi — HTTP $code $(head -c 200 /tmp/watch.json)"; fi
          check "Gemini (vize bilgisi)" travel-info '{"passport":"TR","destination":"JP"}' '"\(.requirement) · \(.summary[0:80])"'
          check "Gemini + Places (Şehrim akşam planı)" city '{"action":"evening","when":"tonight","companion":"friends","budget":"mid","timezone":"Europe/Istanbul"}' '"\(.title) · \(.stops | length) durak, doğrulanan \([.stops[] | select(.google_place_id)] | length)"'
