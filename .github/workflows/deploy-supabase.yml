# Veritabanı şemasını ve Edge Function'ları Supabase projesine yükler.
# Gerekli GitHub sırları (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF
# main'e supabase/ altında değişiklik gelince veya elle (Run workflow) çalışır.
name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Sırlar tanımlı mı
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase sırları eksik; yükleme atlandı." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - name: Projeye bağlan
        if: steps.check.outputs.ready == 'true'
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Veritabanı şeması (migration'lar)
        if: steps.check.outputs.ready == 'true'
        run: npx supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Edge Function'lar
        if: steps.check.outputs.ready == 'true'
        run: |
          for f in parse-document generate-itinerary replan places translate travel-info trip-report subscription delete-account; do
            npx supabase functions deploy "$f" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done
          npx supabase functions deploy revenuecat-webhook --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
      - name: Özet
        if: steps.check.outputs.ready == 'true'
        run: echo "Supabase yüklendi → https://$SUPABASE_PROJECT_REF.supabase.co" >> "$GITHUB_STEP_SUMMARY"
