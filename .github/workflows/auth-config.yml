# Supabase giriş (Auth) ayarlarını gösterir; istenirse Apple ile girişi ve uygulama
# dönüş adresini açar. Sır yazdırmaz (sadece açık/kapalı ve sayısal ayarlar).
name: Giriş ayarları

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apple girişi, yola:// dönüş adresi ve 6 haneli e-posta kodu (true/false)
        default: 'false'

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Ayarlar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          APPLY: ${{ inputs.apply }}
        run: |
          ref=$(printf '%s' "$SUPABASE_PROJECT_REF" | tr -d '[:space:]')
          token=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$token"
          api="https://api.supabase.com/v1/projects/$ref/config/auth"
          show() {
            curl -sSf -H "Authorization: Bearer $token" "$api" | jq '{
              site_url, uri_allow_list,
              custom_smtp: (.smtp_host != null and .smtp_host != ""),
              email_enabled: .external_email_enabled, phone_enabled: .external_phone_enabled, sms_provider,
              apple_enabled: .external_apple_enabled, apple_client_id: .external_apple_client_id,
              google_enabled: .external_google_enabled, google_client_id_set: (.external_google_client_id != null and .external_google_client_id != ""),
              rate_limit_email_sent, mailer_otp_exp, mailer_otp_length
            }' | tee -a "$GITHUB_STEP_SUMMARY"
          }
          show
          if [ "$APPLY" = "true" ]; then
            current=$(curl -sSf -H "Authorization: Bearer $token" "$api" | jq -r '.uri_allow_list // ""')
            list=$(printf '%s' "$current" | tr ',' '\n' | grep -v '^$' | { cat; echo 'yola://auth-callback'; echo 'yola://**'; } | sort -u | paste -sd, -)
            curl -sSf -X PATCH -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "$api" \
              -d "$(jq -n --arg list "$list" '{external_apple_enabled: true, external_apple_client_id: "com.akturangroup.yola", uri_allow_list: $list, mailer_otp_length: 6}')" > /dev/null
            echo "### Uygulandı" | tee -a "$GITHUB_STEP_SUMMARY"
            show
          fi
